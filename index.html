<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estimation de reprise de votre voiture</title>
    <link rel="stylesheet" href="index.scss" />
  </head>
  <body>
    <div class="container">
      <h1 class="main-title">Estimation de reprise de votre voiture</h1>

      <div class="content-wrapper">
        <div class="brand-selection">
          <h2 class="section-title">
            Sélectionnez la marque de votre véhicule
          </h2>

          <div class="brand-grid">
            <div class="brand-item">
              <div class="brand-logo">
                <img src="img/Renault.png" alt="Renault logo" />
              </div>
              <span class="brand-name">RENAULT</span>
            </div>

            <div class="brand-item selected">
              <div class="brand-logo">
                <img src="img/Peugeot.png" alt="Peugeot logo" />
              </div>
              <span class="brand-name">PEUGEOT</span>
              <div class="selection-indicator"></div>
            </div>

            <div class="brand-item">
              <div class="brand-logo">
                <img src="img/citroen.png" alt="Citroën logo" />
              </div>
              <span class="brand-name">CITROËN</span>
            </div>

            <div class="brand-item">
              <div class="brand-logo">
                <img src="img/opel.png" alt="Opel logo" />
              </div>
              <span class="brand-name">OPEL</span>
            </div>

            <div class="brand-item">
              <div class="brand-logo">
                <img src="img/Volkswagen.png" alt="Volkswagen logo" />
              </div>
              <span class="brand-name">VOLKSWAGEN</span>
            </div>

            <div class="brand-item">
              <div class="brand-logo">
                <img src="img/plus.svg" alt="Plus de marques" />
              </div>
              <span class="brand-name">PLUS DE<br />MARQUES</span>
            </div>
          </div>

          <button class="cta-button" id="brand-estimation-btn">
            COMMENCEZ MON ESTIMATION
            <svg class="arrow-icon" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"
              />
            </svg>
          </button>
        </div>

        <div class="divider">
          <span class="divider-text">OU</span>
        </div>

        <div class="license-section">
          <h2 class="section-title">
            Saisissez l'immatriculation de votre véhicule
          </h2>

          <div class="input-group">
            <label for="license-plate" class="input-label"
              >Votre immatriculation</label
            >
            <div class="input-wrapper">
              <input
                type="text"
                id="license-plate"
                class="license-input"
                placeholder="AB-123-CD"
                value=""
              />
              <button class="clear-button" type="button">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path
                    d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
                  />
                </svg>
              </button>
            </div>
            <div class="error-message hidden">
              L'immatriculation n'existe pas !
            </div>
          </div>

          <button class="cta-button" id="license-estimation-btn">
            COMMENCEZ MON ESTIMATION
            <svg class="arrow-icon" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"
              />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <script>
      // Simple JavaScript for demo functionality
      const licenseInput = document.getElementById("license-plate");
      const errorMessage = document.querySelector(".error-message");
      const clearButton = document.querySelector(".clear-button");
      const brandEstimationBtn = document.getElementById(
        "brand-estimation-btn"
      );
      const licenseEstimationBtn = document.getElementById(
        "license-estimation-btn"
      );

      // Function to validate license plate format - only accepts format with dashes
      function isValidLicensePlate(value) {
        // Only accept the format with dashes (AB-123-CD)
        const withDashesPattern = /^[A-Z]{2}-\d{3}-[A-Z]{2}$/;
        return withDashesPattern.test(value);
      }

      // Function to get selected brand
      function getSelectedBrand() {
        const selectedBrand = document.querySelector(".brand-item.selected");
        return selectedBrand
          ? selectedBrand.querySelector(".brand-name").textContent.trim()
          : null;
      }

      // Function to redirect to infos.html with parameters
      function redirectToInfos(licenseNumber = null, brand = null) {
        const params = new URLSearchParams();
        if (licenseNumber) {
          params.append("license", licenseNumber);
        }
        if (brand) {
          params.append("brand", brand);
        }
        window.location.href = `infos.html?${params.toString()}`;
      }

      // Show error for invalid license plate (including those without dashes)
      licenseInput.addEventListener("input", function () {
        const value = this.value.toUpperCase().trim();

        if (value.length > 0 && !isValidLicensePlate(value)) {
          this.classList.add("error");
          errorMessage.classList.remove("hidden");
        } else {
          this.classList.remove("error");
          errorMessage.classList.add("hidden");
        }
      });

      // Clear input and reset error state
      clearButton.addEventListener("click", function () {
        licenseInput.value = "";
        licenseInput.classList.remove("error");
        errorMessage.classList.add("hidden");
        licenseInput.focus(); // Focus back on input for better UX
      });

      // Brand selection
      document.querySelectorAll(".brand-item").forEach((item) => {
        item.addEventListener("click", function () {
          document
            .querySelectorAll(".brand-item")
            .forEach((i) => i.classList.remove("selected"));
          this.classList.add("selected");
        });
      });

      // Brand estimation button click
      brandEstimationBtn.addEventListener("click", function () {
        const selectedBrand = getSelectedBrand();
        if (selectedBrand && selectedBrand !== "PLUS DE\nMARQUES") {
          redirectToInfos(null, selectedBrand);
        } else {
          alert("Veuillez sélectionner une marque de véhicule.");
        }
      });

      // License estimation button click
      licenseEstimationBtn.addEventListener("click", function () {
        const licenseValue = licenseInput.value.toUpperCase().trim();

        if (licenseValue && isValidLicensePlate(licenseValue)) {
          redirectToInfos(licenseValue, null);
        } else if (licenseValue) {
          // Show error if license plate is not valid
          licenseInput.classList.add("error");
          errorMessage.classList.remove("hidden");
        } else {
          alert("Veuillez saisir votre immatriculation.");
        }
      });
    </script>
  </body>
</html>
