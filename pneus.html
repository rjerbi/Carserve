<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>État des pneus</title>
    <link rel="stylesheet" href="index.scss" />
  </head>
  <body>
    <div class="container">
      <!-- Progress Bar -->
      <div class="progress-bar">
        <div class="progress-step active">
          <div class="progress-step-text">Informations<br />du véhicule</div>
          <div class="progress-circle active"></div>
        </div>
        <div class="progress-line">
          <div class="progress-line-fill active"></div>
        </div>
        <div class="progress-step">
          <div class="progress-step-text">Votre<br />point de vente</div>
          <div class="progress-circle"></div>
        </div>
        <div class="progress-line">
          <div class="progress-line-fill"></div>
        </div>
        <div class="progress-step">
          <div class="progress-step-text">Votre profil</div>
          <div class="progress-circle"></div>
        </div>
        <div class="progress-line">
          <div class="progress-line-fill"></div>
        </div>
        <div class="progress-step">
          <div class="progress-step-text">Votre<br />estimation</div>
          <div class="progress-circle"></div>
        </div>
      </div>

      <!-- Main Content -->
      <div class="tires-container">
        <!-- Front Tires Section -->
        <div class="tire-section">
          <h2 class="tire-question">Quelle est l'usure de vos pneus avant ?</h2>
          <div class="tire-options">
            <button
              class="tire-btn"
              data-tire="front"
              data-condition="neuf"
              onclick="selectTireCondition('front', 'neuf')"
            >
              ÉTAT NEUF
            </button>
            <button
              class="tire-btn"
              data-tire="front"
              data-condition="intermediaire"
              onclick="selectTireCondition('front', 'intermediaire')"
            >
              ÉTAT INTERMÉDIAIRE
            </button>
            <button
              class="tire-btn"
              data-tire="front"
              data-condition="lisse"
              onclick="selectTireCondition('front', 'lisse')"
            >
              PNEU LISSE
            </button>
          </div>
        </div>

        <!-- Rear Tires Section -->
        <div class="tire-section">
          <h2 class="tire-question">
            Quelle est l'usure de vos pneus arrière ?
          </h2>
          <div class="tire-options">
            <button
              class="tire-btn"
              data-tire="rear"
              data-condition="neuf"
              onclick="selectTireCondition('rear', 'neuf')"
            >
              ÉTAT NEUF
            </button>
            <button
              class="tire-btn"
              data-tire="rear"
              data-condition="intermediaire"
              onclick="selectTireCondition('rear', 'intermediaire')"
            >
              ÉTAT INTERMÉDIAIRE
            </button>
            <button
              class="tire-btn"
              data-tire="rear"
              data-condition="lisse"
              onclick="selectTireCondition('rear', 'lisse')"
            >
              PNEU LISSE
            </button>
          </div>
        </div>
      </div>

      <!-- Navigation Buttons -->
      <div class="navigation-buttons">
        <button class="btn-previous" onclick="goBack()">PRÉCÉDENT</button>
        <button class="cta-button" onclick="continueToNext()">
          CONTINUER
          <svg
            class="arrow-icon"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 5l7 7-7 7"
            ></path>
          </svg>
        </button>
      </div>
    </div>

    <script>
      // Get URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const licensePlate = urlParams.get("license");
      const brand = urlParams.get("brand");
      const model = urlParams.get("model");
      const year = urlParams.get("year");
      const month = urlParams.get("month");
      const fuel = urlParams.get("fuel");
      const vehicleType = urlParams.get("vehicleType");
      const doors = urlParams.get("doors");
      const transmission = urlParams.get("transmission");
      const power = urlParams.get("power");
      const version = urlParams.get("version");
      const color = urlParams.get("color");
      const equipment = urlParams.getAll("equipment");
      const mileage = urlParams.get("mileage");
      const vehicleStatus = urlParams.get("vehicleStatus");

      let selectedTires = {
        front: null,
        rear: null,
      };

      function selectTireCondition(tirePosition, condition) {
        selectedTires[tirePosition] = condition;

        // Remove selected class from all buttons of this tire position
        document
          .querySelectorAll(`[data-tire="${tirePosition}"]`)
          .forEach((btn) => {
            btn.classList.remove("selected");
          });

        // Add selected class to clicked button
        document
          .querySelector(
            `[data-tire="${tirePosition}"][data-condition="${condition}"]`
          )
          .classList.add("selected");
      }

      function goBack() {
        const params = new URLSearchParams();
        if (licensePlate) params.append("license", licensePlate);
        if (brand) params.append("brand", brand);
        if (model) params.append("model", model);
        if (year) params.append("year", year);
        if (month) params.append("month", month);
        if (fuel) params.append("fuel", fuel);
        if (vehicleType) params.append("vehicleType", vehicleType);
        if (doors) params.append("doors", doors);
        if (transmission) params.append("transmission", transmission);
        if (power) params.append("power", power);
        if (version) params.append("version", version);
        if (color) params.append("color", color);
        equipment.forEach((eq) => params.append("equipment", eq));
        if (mileage) params.append("mileage", mileage);
        if (vehicleStatus) params.append("vehicleStatus", vehicleStatus);

        window.location.href = `vehicule.html?${params.toString()}`;
      }

      function continueToNext() {
        if (!selectedTires.front || !selectedTires.rear) {
          alert("Veuillez sélectionner l'état de vos pneus avant et arrière.");
          return;
        }

        const params = new URLSearchParams();
        if (licensePlate) params.append("license", licensePlate);
        if (brand) params.append("brand", brand);
        if (model) params.append("model", model);
        if (year) params.append("year", year);
        if (month) params.append("month", month);
        if (fuel) params.append("fuel", fuel);
        if (vehicleType) params.append("vehicleType", vehicleType);
        if (doors) params.append("doors", doors);
        if (transmission) params.append("transmission", transmission);
        if (power) params.append("power", power);
        if (version) params.append("version", version);
        if (color) params.append("color", color);
        equipment.forEach((eq) => params.append("equipment", eq));
        if (mileage) params.append("mileage", mileage);
        if (vehicleStatus) params.append("vehicleStatus", vehicleStatus);
        params.append("frontTires", selectedTires.front);
        params.append("rearTires", selectedTires.rear);

        // Changez cette ligne vers la page suivante de votre choix
        window.location.href = `importation.html?${params.toString()}`;
      }

      // Pre-select tire conditions if they exist in URL
      const preSelectedFrontTires = urlParams.get("frontTires");
      const preSelectedRearTires = urlParams.get("rearTires");

      if (preSelectedFrontTires) {
        selectTireCondition("front", preSelectedFrontTires);
      }
      if (preSelectedRearTires) {
        selectTireCondition("rear", preSelectedRearTires);
      }
    </script>
  </body>
</html>
