<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Type de Véhicule</title>
    <link rel="stylesheet" href="index.scss" />
  </head>
  <body>
    <div class="container">
      <!-- Progress Bar -->
      <div class="progress-bar">
        <div class="progress-step active">
          <div class="progress-step-text">Informations<br />du véhicule</div>
          <div class="progress-circle active"></div>
        </div>
        <div class="progress-line">
          <div class="progress-line-fill"></div>
        </div>
        <div class="progress-step">
          <div class="progress-step-text">Votre<br />point de vente</div>
          <div class="progress-circle"></div>
        </div>
        <div class="progress-line">
          <div class="progress-line-fill"></div>
        </div>
        <div class="progress-step">
          <div class="progress-step-text">Votre profil</div>
          <div class="progress-circle"></div>
        </div>
        <div class="progress-line">
          <div class="progress-line-fill"></div>
        </div>
        <div class="progress-step">
          <div class="progress-step-text">Votre<br />estimation</div>
          <div class="progress-circle"></div>
        </div>
      </div>

      <!-- Main Content -->
      <div class="vehicle-type-container">
        <h2 class="section-title">Quel est le type de véhicule ?</h2>

        <div class="vehicle-type-selection">
          <button class="vehicle-type-btn" data-type="berline">BERLINE</button>
          <button class="vehicle-type-btn" data-type="break">BREAK</button>
          <button class="vehicle-type-btn" data-type="utilitaire">
            UTILITAIRE
          </button>
        </div>
      </div>

      <!-- Navigation Buttons -->
      <div class="navigation-buttons">
        <button class="btn-previous" onclick="goBack()">PRÉCÉDENT</button>
        <button class="cta-button" onclick="continueToNext()">
          CONTINUER
          <svg
            class="arrow-icon"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 5l7 7-7 7"
            ></path>
          </svg>
        </button>
      </div>
    </div>

    <script>
      // Get URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const licensePlate = urlParams.get("license") || "";
      const brand = urlParams.get("brand") || "";
      const model = urlParams.get("model") || "";
      const year = urlParams.get("year") || "";
      const month = urlParams.get("month") || "";
      const fuel = urlParams.get("fuel") || "";

      let selectedVehicleType = "";

      // Vehicle type selection functionality
      document.querySelectorAll(".vehicle-type-btn").forEach((button) => {
        button.addEventListener("click", function () {
          // Remove selected class from all buttons
          document.querySelectorAll(".vehicle-type-btn").forEach((btn) => {
            btn.classList.remove("selected");
          });

          // Add selected class to clicked button
          this.classList.add("selected");
          selectedVehicleType = this.dataset.type;
        });
      });

      function goBack() {
        const params = new URLSearchParams();
        if (licensePlate) params.append("license", licensePlate);
        if (brand) params.append("brand", brand);
        if (model) params.append("model", model);
        if (year) params.append("year", year);
        if (month) params.append("month", month);
        if (fuel) params.append("fuel", fuel);

        window.location.href = `carburant.html?${params.toString()}`;
      }

      function continueToNext() {
        if (!selectedVehicleType) {
          alert("Veuillez sélectionner le type de véhicule.");
          return;
        }

        const params = new URLSearchParams();
        if (licensePlate) params.append("license", licensePlate);
        if (brand) params.append("brand", brand);
        if (model) params.append("model", model);
        if (year) params.append("year", year);
        if (month) params.append("month", month);
        if (fuel) params.append("fuel", fuel);
        params.append("vehicleType", selectedVehicleType);

        // Redirect to nombre_portes.html
        window.location.href = `nombre_portes.html?${params.toString()}`;
      }

      // Pre-select vehicle type if it exists in URL
      const preSelectedVehicleType = urlParams.get("vehicleType");
      if (preSelectedVehicleType) {
        const vehicleTypeBtn = document.querySelector(
          `[data-type="${preSelectedVehicleType}"]`
        );
        if (vehicleTypeBtn) {
          vehicleTypeBtn.classList.add("selected");
          selectedVehicleType = preSelectedVehicleType;
        }
      }
    </script>
  </body>
</html>
