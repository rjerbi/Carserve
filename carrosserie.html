<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Couleur de carrosserie</title>
    <link rel="stylesheet" href="index.scss" />
  </head>
  <body>
    <div class="container">
      <!-- Progress Bar -->
      <div class="progress-bar">
        <div class="progress-step active">
          <div class="progress-step-text">Informations<br />du véhicule</div>
          <div class="progress-circle active"></div>
        </div>
        <div class="progress-line">
          <div class="progress-line-fill"></div>
        </div>
        <div class="progress-step">
          <div class="progress-step-text">Votre<br />point de vente</div>
          <div class="progress-circle"></div>
        </div>
        <div class="progress-line">
          <div class="progress-line-fill"></div>
        </div>
        <div class="progress-step">
          <div class="progress-step-text">Votre profil</div>
          <div class="progress-circle"></div>
        </div>
        <div class="progress-line">
          <div class="progress-line-fill"></div>
        </div>
        <div class="progress-step">
          <div class="progress-step-text">Votre<br />estimation</div>
          <div class="progress-circle"></div>
        </div>
      </div>

      <!-- Main Content -->
      <div class="color-selection-container">
        <h2 class="section-title">Couleur de carrosserie de votre véhicule</h2>

        <div class="color-selection">
          <div class="color-row">
            <button class="color-btn" data-color="NOIR">NOIR</button>
            <button class="color-btn" data-color="GRIS">GRIS</button>
            <button class="color-btn" data-color="ROUGE">ROUGE</button>
            <button class="color-btn" data-color="BLEU">BLEU</button>
          </div>
          <div class="color-row">
            <button class="color-btn" data-color="JAUNE">JAUNE</button>
            <button class="color-btn" data-color="VERT">VERT</button>
            <button class="color-btn" data-color="BEIGE">BEIGE</button>
            <button class="color-btn" data-color="BLANC">BLANC</button>
          </div>
        </div>
      </div>

      <!-- Navigation Buttons -->
      <div class="navigation-buttons">
        <button class="btn-previous" onclick="goBack()">PRÉCÉDENT</button>
        <button class="cta-button" onclick="continueToNext()">
          CONTINUER
          <svg
            class="arrow-icon"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 5l7 7-7 7"
            ></path>
          </svg>
        </button>
      </div>
    </div>

    <script>
      // Get URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const licensePlate = urlParams.get("license") || "";
      const brand = urlParams.get("brand") || "";
      const model = urlParams.get("model") || "";
      const year = urlParams.get("year") || "";
      const month = urlParams.get("month") || "";
      const fuel = urlParams.get("fuel") || "";
      const vehicleType = urlParams.get("vehicleType") || "";
      const doors = urlParams.get("doors") || "";
      const transmission = urlParams.get("transmission") || "";
      const power = urlParams.get("power") || "";
      const version = urlParams.get("version") || "";

      let selectedColor = "";

      // Color selection functionality
      document.querySelectorAll(".color-btn").forEach((button) => {
        button.addEventListener("click", function () {
          // Remove selected class from all buttons
          document.querySelectorAll(".color-btn").forEach((btn) => {
            btn.classList.remove("selected");
          });

          // Add selected class to clicked button
          this.classList.add("selected");
          selectedColor = this.dataset.color;
        });
      });

      function goBack() {
        const params = new URLSearchParams();
        if (licensePlate) params.append("license", licensePlate);
        if (brand) params.append("brand", brand);
        if (model) params.append("model", model);
        if (year) params.append("year", year);
        if (month) params.append("month", month);
        if (fuel) params.append("fuel", fuel);
        if (vehicleType) params.append("vehicleType", vehicleType);
        if (doors) params.append("doors", doors);
        if (transmission) params.append("transmission", transmission);
        if (power) params.append("power", power);
        if (version) params.append("version", version);

        window.location.href = `version.html?${params.toString()}`;
      }

      function continueToNext() {
        if (!selectedColor) {
          alert("Veuillez sélectionner une couleur de carrosserie.");
          return;
        }

        const params = new URLSearchParams();
        if (licensePlate) params.append("license", licensePlate);
        if (brand) params.append("brand", brand);
        if (model) params.append("model", model);
        if (year) params.append("year", year);
        if (month) params.append("month", month);
        if (fuel) params.append("fuel", fuel);
        if (vehicleType) params.append("vehicleType", vehicleType);
        if (doors) params.append("doors", doors);
        if (transmission) params.append("transmission", transmission);
        if (power) params.append("power", power);
        if (version) params.append("version", version);
        params.append("color", selectedColor);

        window.location.href = `equipement.html?${params.toString()}`;
      }

      // Pre-select color if it exists in URL
      const preSelectedColor = urlParams.get("color");
      if (preSelectedColor) {
        document.querySelectorAll(".color-btn").forEach((btn) => {
          if (btn.dataset.color === preSelectedColor) {
            btn.classList.add("selected");
            selectedColor = preSelectedColor;
          }
        });
      }
    </script>
  </body>
</html>
